name: Bug report
description: Report a reproducible Meshlet bug.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands and inputs.
      placeholder: |
        1. cargo run -- ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meshlet version or commit
      placeholder: v0.4.0 or commit hash
    validations:
      required: false
  - type: input
    id: rust
    attributes:
      label: Rust version
      placeholder: rustc --version
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Do not paste secrets, private payloads, local DB contents, or raw `.meshlet/` files.
    validations:
      required: false
